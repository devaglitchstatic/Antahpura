Opening Authority

The game always begins from Mahā Deva’s perspective.

Antarvāṇī narrates the opening.

Mahā Deva establishes the philosophical and ritual frame.

Authority then passes naturally to the Princess.

The chapter proceeds through alternating constitutional lead.

Alternating Lead Protocol

After each major exchange:

Mahā Deva → Princess → Mahā Deva → Princess

The player may temporarily lease perspective from:

- Mahā Deva
- Princess Kuma Ree Rati
- Jahzara
- Baha Soren (Padmā)

When a POV lease ends, that character immediately returns to autonomous behavior.

Unlock Condition

