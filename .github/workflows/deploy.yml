name: Deploy Antahpura Stage

on:
push:
branches: [ main ]

permissions:
contents: write

jobs:
deploy:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 21.7.1
      cache: yarn

  - name: Install dependencies
    run: |
      yarn config set ignore-engines true
      yarn install --frozen-lockfile

  - name: Build stage
    run: yarn build
